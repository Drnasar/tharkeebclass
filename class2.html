<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ഓൺലൈൻ ക്ലാസുകൾ (Simple Player)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    nav {
      background: #1e293b;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    nav h1 {
      font-size: 1.25rem;
      color: #38bdf8;
    }

    /* ലളിതമായ ലോഗിൻ ബോക്സ് */
    #lockScreen {
      position: fixed;
      inset: 0;
      background: #0b0f19;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }

    .lock-box {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      border: 1px solid #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .lock-box h2 {
      margin-bottom: 10px;
      color: #38bdf8;
    }

    .lock-box p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .lock-box input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1.1rem;
      text-align: center;
      margin-bottom: 15px;
      outline: none;
    }

    .lock-box button {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .lock-box button:hover {
      background: #0369a1;
    }

    /* Main Container */
    .main-container {
      display: flex;
      flex: 1;
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      gap: 20px;
    }

    /* Video Player */
    .video-section {
      flex: 2.2;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .player-box {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      padding-bottom: 56.25%; /* 16:9 ratio */
      height: 0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .player-box iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* മുകളിൽ വലതുവശത്തുള്ള ഡ്രൈവ് പോപ്പ്-ഔട്ട് ബട്ടൺ തടയാനുള്ള ഷീൽഡ് */
    .drive-shield {
      position: absolute;
      top: 0;
      right: 0;
      width: 80px;
      height: 60px;
      z-index: 10;
      background: transparent;
    }

    .video-details {
      background: #1e293b;
      padding: 16px 20px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .video-details h2 {
      font-size: 1.15rem;
      color: #f1f5f9;
    }

    .nav-btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 8px 16px;
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn:hover:not(:disabled) {
      background: #0284c7;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ലളിതമായ പ്ലേലിസ്റ്റ് (സബ്ജക്റ്റുകൾ ഇല്ലാതെ) */
    .playlist-section {
      flex: 1;
      background: #1e293b;
      border-radius: 12px;
      padding: 18px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      max-height: 75vh;
    }

    .playlist-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 15px;
      color: #38bdf8;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }

    .class-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 5px;
    }

    .class-item {
      padding: 12px 14px;
      background: #0f172a;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #cbd5e1;
      font-size: 0.9rem;
      border: 1px solid transparent;
      transition: 0.2s;
    }

    .class-item:hover {
      background: #1e293b;
      border-color: #38bdf8;
    }

    .class-item.active {
      background: #0369a1;
      color: #fff;
      border-color: #38bdf8;
    }

    .class-number {
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    @media (max-width: 900px) {
      .main-container {
        flex-direction: column;
      }
      .playlist-section {
        max-height: 400px;
      }
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- ലളിതമായ പാസ്‌വേഡ് സ്ക്രീൻ -->
  <div id="lockScreen">
    <div class="lock-box">
      <h2>🔐 ക്ലാസ് ലോഗിൻ</h2>
      <p>ക്ലാസിൽ പ്രവേശിക്കാൻ നൽകിയിട്ടുള്ള PIN നൽകുക</p>
      <input type="password" id="passInput" placeholder="PIN നൽകുക" />
      <button onclick="checkPin()">പ്രവേശിക്കുക</button>
      <p id="errText" style="color: #f87171; font-size: 0.85rem; margin-top: 10px; display: none;">തെറ്റായ PIN! വീണ്ടും ശ്രമിക്കുക.</p>
    </div>
  </div>

  <nav>
    <h1>🎓 ഓൺലൈൻ ക്ലാസ്സ് റൂം</h1>
  </nav>

  <div class="main-container">
    <!-- വീഡിയോ ഭാഗം -->
    <div class="video-section">
      <div class="player-box">
        <iframe id="driveFrame" src="" allow="autoplay" allowfullscreen></iframe>
        <!-- പുറത്തേക്ക് പോകാനുള്ള ഡ്രൈവ് പോപ്പ്-ഔട്ട് തടയുന്ന ഷീൽഡ് -->
        <div class="drive-shield"></div>
      </div>

      <div class="video-details">
        <h2 id="videoTitle">ക്ലാസ് തിരഞ്ഞെടുക്കുക...</h2>
        <div class="nav-btn-group">
          <button id="prevBtn" class="btn" onclick="prevVideo()">◀ മുൻപത്തെ ക്ലാസ്</button>
          <button id="nextBtn" class="btn" onclick="nextVideo()">അടുത്ത ക്ലാസ് ▶</button>
        </div>
      </div>
    </div>

    <!-- സബ്ജക്റ്റുകൾ ഇല്ലാത്ത ലളിതമായ ക്ലാസ് ലിസ്റ്റ് -->
    <div class="playlist-section">
      <div class="playlist-title">ആമുഖം ക്ലാസുകള്‍</div>
      <div class="class-list" id="classListContainer"></div>
    </div>
  </div>

  <script>
    // -----------------------------------------------------------
    // 1. നിങ്ങളുടെ ലോഗിൻ PIN (ഇഷ്ടമുള്ളത് നൽകാം)
    // -----------------------------------------------------------
    const APP_PIN = "1234";

    // -----------------------------------------------------------
    // 2. ഗൂഗിൾ ഡ്രൈവ് വീഡിയോകളുടെ ID-യും പേരും ഇവിടെ നൽകുക
    // (സബ്ജക്റ്റുകൾ ഒന്നുമില്ലാതെ ഒന്നിനു പിറകെ ഒന്നായി)
    // -----------------------------------------------------------
    const videoList = [
      { id: "1MPtjJ7Isc2G2coIyBvYFsY39juIT1Q6o", title: "ക്ലാസ് 1: ആമുഖം" },
      { id: "1Nrj1hEDy9JrozQB7RDID7ngnf5bLKmGG", title: "ക്ലാസ് 1: ഭാഗം 2" },
      { id: "1VkCXr_YBNxdL6P5dcGxQdOAH3bQBz6e5", title: "ക്ലാസ് 1: ഭാഗം 3" },
      { id: "", title: "ക്ലാസ് 2: ഭാഗം 1" },
      { id: "1yb3lf7oGgoxTeZdN5NViGo96AEd05hGm", title: "ക്ലാസ് 3: ഭാഗം 1" },
      { id: "1l_I8eKPUOuVDFWbmc9K-l06fmh4L_svy", title: "ക്ലാസ് 3: ഭാഗം 2" },
      { id: "1pr7jwQsKNy00kMZLwc53coYF6E5gJPLG", title: "ക്ലാസ് 3: ഭാഗം 3" },
      { id: "1qvG4fph9vcGwSRo4L8xsdinO10OdPwA6", title: "ക്ലാസ് 3: ഭാഗം 4" },
      { id: "1L0yjs1XNhr2zWjg-UDiGtgpscsgsTkPG", title: "ക്ലാസ് 3: ഭാഗം 5" },
      { id: "1PYlZhZk1OeS7GDCfjLPTTgbT_B9KaD__", title: "ക്ലാസ് 3: ഭാഗം 6" },
      { id: "14SUuMGChP6mWfvqPW0bfSZgxk_l0aYKv", title: "ക്ലാസ് 3: ഭാഗം 7" }
      

      // കൂടുതൽ ക്ലാസുകൾ വേണമെങ്കിൽ ഇതേ രൂപത്തിൽ താഴേക്ക് ചേർക്കാം
    ];

    let currentIndex = 0;

    // ലോഗിൻ പരിശോധന
    function checkPin() {
      const entered = document.getElementById("passInput").value.trim();
      const errText = document.getElementById("errText");

      if (entered === APP_PIN) {
        document.getElementById("lockScreen").style.display = "none";
        loadVideo(0); // ആദ്യത്തെ ക്ലാസ് തുറക്കുന്നു
      } else {
        errText.style.display = "block";
      }
    }

    // ക്ലാസ് ലിസ്റ്റ് സ്ക്രീനിൽ കാണിക്കുന്നു
    function renderList() {
      const container = document.getElementById("classListContainer");
      container.innerHTML = "";

      videoList.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = `class-item ${index === currentIndex ? 'active' : ''}`;
        div.onclick = () => loadVideo(index);

        div.innerHTML = `
          <span class="class-number">${index + 1}</span>
          <span>${item.title}</span>
        `;
        container.appendChild(div);
      });
    }

    // വീഡിയോ മാറ്റുന്ന ഫംഗ്ഷൻ
    function loadVideo(index) {
      currentIndex = index;
      const video = videoList[index];

      // ഗൂഗിൾ ഡ്രൈവ് വീഡിയോ ലിങ്ക് നൽകുന്നു
      document.getElementById("driveFrame").src = `https://drive.google.com/file/d/${video.id}/preview`;
      document.getElementById("videoTitle").innerText = video.title;

      // ബട്ടണുകളുടെ ആക്റ്റീവ് അവസ്ഥ മാറ്റുന്നു
      document.getElementById("prevBtn").disabled = (currentIndex === 0);
      document.getElementById("nextBtn").disabled = (currentIndex === videoList.length - 1);

      renderList();
    }

    function nextVideo() {
      if (currentIndex < videoList.length - 1) loadVideo(currentIndex + 1);
    }

    function prevVideo() {
      if (currentIndex > 0) loadVideo(currentIndex - 1);
    }

    document.getElementById("passInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") checkPin();
    });

    // തുടക്കത്തിൽ ലിസ്റ്റ് റെൻഡർ ചെയ്യുന്നു
    renderList();
  </script>
</body>
</html>
